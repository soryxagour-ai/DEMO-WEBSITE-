<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5000 Tap Challenge</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

.container{
  width:90%;
  max-width:450px;
}

h1{
  margin-bottom:20px;
}

#count{
  font-size:32px;
  margin:20px 0;
  font-weight:bold;
}

button{
  width:100%;
  padding:25px;
  border:none;
  border-radius:15px;
  background:#2563eb;
  color:white;
  font-size:24px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

#result{
  display:none;
  font-size:100px;
  margin-top:30px;
}

.progress{
  height:12px;
  background:#333;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:25px;
}

#bar{
  height:100%;
  width:0%;
  background:#2563eb;
}
</style>
</head>

<body>

<div class="container">

  <h1>🔥 5000 Tap Challenge</h1>

  <div class="progress">
    <div id="bar"></div>
  </div>

  <div id="count">0 / 5000</div>

  <button id="tapButton">TAP HERE</button>

  <div id="result">🖕</div>

</div>

<script>
let taps = 0;
const target = 5000;

const button = document.getElementById("tapButton");
const count = document.getElementById("count");
const bar = document.getElementById("bar");
const result = document.getElementById("result");

button.addEventListener("click", function(){

  if(taps >= target) return;

  taps++;

  count.textContent = taps + " / " + target;

  let percentage = (taps / target) * 100;
  bar.style.width = percentage + "%";

  if(taps === target){
    button.textContent = "DONE 🎉";
    button.disabled = true;
    result.style.display = "block";
  }

});
</script>

</body>
</html>
